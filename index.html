/* =========================================================
   SERVICE ORDER — 写真選択 + 申込みフォーム（汎用サービス）
   ========================================================= */
async function viewServiceOrder(id, svcId) {
  showLoading();
  let a, content;
  try {
    a = await Backend.get(id);
    content = await Backend.getContent();
  } catch (e) { hideLoading(); return errorPage(e); }
  hideLoading();
  if (!a) return notFound();
  if (a.expired) return expiredPage(a);
  if (a.locked) return passwordGate(a, async (input) => {
    sessionStorage.setItem('pw_' + id, input);
    const fresh = await Backend.get(id);
    if (fresh && fresh.locked) { sessionStorage.removeItem('pw_' + id); return false; }
    return true;
  }, () => viewServiceOrder(id, svcId));
  const s = ((content && content.services) || []).find(x => x.id === svcId);
  if (!s || !s.order || !s.order.enabled) return notFound();

  const MIN = Math.max(0, parseInt(s.order.photoMin, 10) || 0);
  const MAX = Math.max(MIN, parseInt(s.order.photoMax, 10) || 0);

  // 写真選択なしのサービス → そのままフォームへ
  if (MAX === 0) {
    const v0 = el(`<div class="center-page">
      <div class="emoji">🎁</div>
      <h1>${esc(s.name)} お申し込み</h1>
      <p>フォームからお申し込みください。</p>
      <button class="btn btn-accent" id="soOpen">申し込みフォームを開く</button>
      <button class="btn btn-ghost" id="soBack" style="margin-top:12px">← アルバムに戻る</button>
    </div>`);
    v0.querySelector('#soOpen').onclick = () => openServiceOrderForm(a, s, []);
    v0.querySelector('#soBack').onclick = () => go('#/album/' + id);
    render(v0);
    openServiceOrderForm(a, s, []);
    return;
  }

  let selected = new Set();
  const countLabel = MIN === MAX ? `${MAX}枚` : `${MIN}〜${MAX}枚`;
  const v = el(`<div>
    <div class="select-head">
      <div class="ttl">🎁 ${esc(s.name)} <span>| ${esc(Backend.SITE.brand)}</span></div>
      <button class="btn btn-ghost btn-sm" id="soBackAlbum">← アルバムに戻る</button>
    </div>
    <div class="pb-instruction">「${esc(s.name)}」に使うお写真を<b>${countLabel}</b>お選びください。</div>
    <div class="pb-counter" id="soCounter"></div>
    <div class="section-wrap">
      <div class="photo-grid selecting" id="grid">
        ${(a.photos || []).map((p, i) => `<div class="photo-cell" data-i="${i}" data-p="${p.id}">
            <img src="${p.thumb}" loading="lazy">
            <div class="check">✓</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="select-foot">
      <div id="footCount" style="font-weight:600"></div>
      <button class="btn btn-accent" id="soNext" disabled>申し込み内容を確認する</button>
    </div>
  </div>`);

  const counterEl = v.querySelector('#soCounter');
  const nextBtn = v.querySelector('#soNext');
  const refresh = () => {
    const count = selected.size;
    if (count < MIN) {
      counterEl.innerHTML = `選択中：<b>${count}枚</b> / ${MAX}枚　あと<b>${MIN - count}枚</b>で申し込みできます`;
      counterEl.className = 'pb-counter pb-counter-warn';
    } else if (count < MAX) {
      counterEl.innerHTML = `選択中：<b>${count}枚</b> / ${MAX}枚　申し込み可能です`;
      counterEl.className = 'pb-counter pb-counter-ok';
    } else {
      counterEl.innerHTML = `<b>${MAX}枚</b>選択済みです。変更する場合は先に別の写真を外してください`;
      counterEl.className = 'pb-counter pb-counter-full';
    }
    nextBtn.disabled = count < MIN;
    v.querySelector('#footCount').textContent = `${count}枚選択中`;
    v.querySelectorAll('.photo-cell').forEach(c => c.classList.toggle('selected', selected.has(c.dataset.p)));
  };
  v.querySelectorAll('.photo-cell').forEach(cell => {
    cell.onclick = () => {
      const pid = cell.dataset.p;
      if (selected.has(pid)) selected.delete(pid);
      else {
        if (selected.size >= MAX) { toast(`${MAX}枚が上限です。先に別の写真を外してください`); return; }
        selected.add(pid);
      }
      refresh();
    };
  });
  v.querySelector('#soBackAlbum').onclick = () => go('#/album/' + id);
  nextBtn.onclick = () => openServiceOrderForm(a, s, [...selected]);
  refresh();
  render(v);
}

function openServiceOrderForm(album, s, photos) {
  const fields = (s.order && s.order.fields) || [];
  const customHTML = fields.map((fd, i) => {
    const req = fd.required ? ' <span style="color:var(--danger)">*</span>' : '';
    if (fd.type === 'textarea') {
      return `<div class="field"><label>${esc(fd.label)}${req}</label>
        <textarea class="input" data-cf="${i}" rows="3" style="resize:vertical"></textarea></div>`;
    }
    if (fd.type === 'select') {
      const opts = String(fd.options || '').split(',').map(x => x.trim()).filter(Boolean);
      return `<div class="field"><label>${esc(fd.label)}${req}</label>
        <select class="input" data-cf="${i}"><option value="">選択してください</option>${opts.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>`;
    }
    return `<div class="field"><label>${esc(fd.label)}${req}</label>
      <input class="input" data-cf="${i}"></div>`;
  }).join('');

  const m = modal(`
    <h2>🎁 ${esc(s.name)} お申し込み確認</h2>
    <div class="pb-confirm-specs">
      <div class="pb-spec-row"><span>サービス</span><span>${esc(s.name)}</span></div>
      ${svcPriceRowHTML(s)}
      ${photos.length ? `<div class="pb-spec-row"><span>選択写真</span><span>${photos.length}枚</span></div>` : ''}
      ${svcSpecRowsHTML(s)}
    </div>
    <div class="modal-divider"></div>
    <div class="field"><label>お名前 <span style="color:var(--danger)">*</span></label>
      <input class="input" id="so_name" placeholder="例：山田 太郎"></div>
    <div class="field"><label>フリガナ</label>
      <input class="input" id="so_kana" placeholder="例：ヤマダ タロウ"></div>
    <div class="field"><label>メールアドレス <span style="color:var(--danger)">*</span></label>
      <input class="input" type="email" id="so_email" placeholder="例：example@gmail.com"></div>
    ${customHTML}
    <div class="field"><label>備考</label>
      <textarea class="input" id="so_note" rows="3" style="resize:vertical" placeholder="ご要望などがあればご記入ください"></textarea></div>
    <div id="so_err" style="color:var(--danger);font-size:13px;display:none;margin-bottom:12px"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="so_cancel">戻る</button>
      <button class="btn btn-accent" id="so_submit">申し込みを送信する</button>
    </div>
  `, 560);
  m.querySelector('#so_cancel').onclick = closeModal;
  m.querySelector('#so_submit').onclick = async (e) => {
    const btn = e.currentTarget;
    const name = m.querySelector('#so_name').value.trim();
    const email = m.querySelector('#so_email').value.trim();
    const errEl = m.querySelector('#so_err');
    const showErr = (msg) => { errEl.textContent = msg; errEl.style.display = 'block'; };
    if (!name) return showErr('お名前を入力してください');
    if (!email || email.indexOf('@') < 0) return showErr('正しいメールアドレスを入力してください');
    const custom = {};
    let missing = null;
    m.querySelectorAll('[data-cf]').forEach(elm => {
      const fd = fields[+elm.dataset.cf];
      const val = (elm.value || '').trim();
      if (fd.required && !val && !missing) missing = fd.label;
      custom[fd.label] = val;
    });
    if (missing) return showErr('「' + missing + '」を入力してください');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = '送信中…'; btn.classList.add('is-loading');
    try {
      await Backend.saveServiceOrder(album.id, {
        serviceId: s.id, serviceName: s.name,
        photos: photos,
        customerName: name,
        customerKana: m.querySelector('#so_kana').value.trim(),
        customerEmail: email,
        note: m.querySelector('#so_note').value.trim(),
        custom: custom,
      });
      closeModal();
      showServiceOrderComplete(album.id, s.name);
    } catch (err) {
      btn.disabled = false; btn.textContent = '申し込みを送信する'; btn.classList.remove('is-loading');
      showErr('送信に失敗しました: ' + err.message);
    }
  };
}

function heroTextSelect(domId, current = 'Photography') {
  const opts = [...new Set([current, ...HERO_TEXTS])];
  return `<select class="input" id="${domId}">${opts.map(t => `<option ${t === current ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
}
function heroFontSelect(domId, current = 'josefin') {
  return `<select class="input" id="${domId}">${Object.entries(FONT_LABELS).map(([k, l]) =>
    `<option value="${k}" ${k === current ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
}
function bindToggle(node, onChange, initial) {
  if (initial !== undefined) node.classList.toggle('on', initial);
  node.onclick = () => { node.classList.toggle('on'); onChange?.(node.classList.contains('on')); };
}
function defaultExpiry() {
  const d = new Date(); d.setMonth(d.getMonth() + 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function modal(innerHTML, maxWidth) {
  closeModal();
  const back = el(`<div class="modal-backdrop"><div class="modal"${maxWidth ? ` style="max-width:${maxWidth}px"` : ''}>${innerHTML}</div></div>`);
  back.onclick = (e) => { if (e.target === back) closeModal(); };
  document.body.appendChild(back);
  bindImgFallbacks(back);
  return back.querySelector('.modal');
}
function closeModal() { document.querySelector('.modal-backdrop')?.remove(); }

/* ---------- boot ---------- */
try {
  // 外部ドメイン(Cloudflare Pages等)のラッパーiframe経由の場合、親URLがクロスオリジンで
  // google.script.url.getLocation() のコールバックが発火せず、ルーティングされないまま真っ白になる。
  // そのため初期ルートはサーバー注入の PDS_ROUTE（?r=a/slug 由来）を最優先で使う。
  if (window.PDS_ROUTE) {
    location.hash = '#/' + PDS_ROUTE;
    router();
  } else if (typeof google !== 'undefined' && google.script && google.script.url) {
    // GAS iframe内ではlocation.hashが親URLのhashを反映しない場合がある
    // google.script.url.getLocation() で正確なhashを取得
    google.script.url.getLocation(function(loc) {
      try {
        if (loc.hash && !location.hash) {
          location.hash = '#/' + loc.hash;
        }
        if (!location.hash) location.hash = '#/admin';
        router();
      } catch(e) {
        document.getElementById('app').innerHTML = '<div style="padding:40px;color:#e85d5d;font-size:14px">起動エラー: ' + (e.message || e) + '</div>';
        console.error('Boot error:', e);
      }
    });
  } else {
    // GAS外（ローカルテストなど）のフォールバック
    if (!location.hash) location.hash = '#/admin';
    router();
  }
} catch(e) {
  document.getElementById('app').innerHTML = '<div style="padding:40px;color:#e85d5d;font-size:14px">起動エラー: ' + (e.message || e) + '</div>';
  console.error('Boot error:', e);
}
